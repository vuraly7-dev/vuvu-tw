:root {
  --bg: #F3F5F2; --surface: #FFFFFF; --ink: #1D2722; --muted: #56615A; --line: #D5DBD6;

  --c-food: #C2410C; --c-animal: #15803D; --c-family: #1D4ED8; --c-home: #7E22CE; --c-action: #A16207; --c-other: #57534E;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }

.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.panel[hidden], [hidden] { display: none !important; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 700; background: var(--accent); color: var(--accent-ink); min-height: 48px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.big { font-size: 20px; min-height: 60px; padding: 14px 28px; }
.notice { background: var(--bg); border-radius: 12px; padding: 14px 16px; color: var(--muted); font-size: 15px; }
.notice strong { color: var(--ink); }
.sharebar { border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.sharebar.dirty { background: var(--warn-bg); border-color: var(--c-action); }
.sharebar .msg { font-weight: 700; }
.previewbar { background: var(--warn-bg); border: 1.5px solid var(--c-action); border-radius: 14px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 700; }
.status { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.score { font-variant-numeric: tabular-nums; font-weight: 700; }
.prompt { font-family: var(--font-display); font-size: 22px; font-weight: 900; text-align: center; margin: 0; text-wrap: balance; }
.grid4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { position: relative; border: 3px solid var(--line); background: var(--surface); border-radius: 16px; padding: 0; overflow: hidden; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; }
.tile img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.tile .word { font-size: 30px; font-weight: 900; padding: 8px; text-align: center; }
.tile .stripe { position: absolute; top: 0; left: 0; right: 0; height: 8px; }
.tile .letter { position: absolute; top: 14px; left: 10px; background: var(--ink); color: var(--surface); border-radius: 8px; padding: 0 8px; font-weight: 900; font-size: 15px; }
.tile.right { border-color: var(--good); box-shadow: 0 0 0 3px var(--good) inset; }
.tile.wrong { border-color: var(--bad); opacity: .5; }
.tile .mark { position: absolute; bottom: 8px; right: 8px; font-weight: 900; font-size: 14px; padding: 2px 10px; border-radius: 999px; color: #fff; }
.tile.right .mark { background: var(--good); }
.tile.wrong .mark { background: var(--bad); }
.reveal { text-align: center; display: flex; flex-direction: column; gap: 4px; }
.reveal .pw { font-size: 30px; font-weight: 900; letter-spacing: .02em; }
.reveal .zh { color: var(--muted); font-size: 18px; }
.reveal .pw mark { background: var(--hl); color: inherit; border-radius: 6px; padding: 0 4px; }
.pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
.plus { font-size: 32px; font-weight: 900; color: var(--muted); }
.center { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 12px; background: var(--surface); font-size: 14px; }
.chip[aria-pressed="true"] { border-color: var(--ink); font-weight: 700; }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; align-items: center; }
.thumb { width: 64px; height: 48px; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; font-weight: 700; }
.thumb img { width: 100%; height: 100%; object-fit: cover; background: #fff; }
.fields { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fields .line1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.zhname { font-weight: 700; }
.ok { color: var(--good); font-size: 13px; font-weight: 700; }
.todo { color: var(--muted); font-size: 13px; }
input[type="text"], select { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; min-width: 0; }
input[type="text"] { width: 100%; }
label.file { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 14px; font-weight: 700; cursor: pointer; min-height: 36px; position: relative; }
label.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
label.file:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
h2 { font-size: 20px; margin: 0; font-weight: 900; }
h3 { font-size: 17px; margin: 0; }
.formgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.formgrid .full { grid-column: 1 / -1; }
.fieldlabel { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 999px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; }
.progressbar { height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; }
.progressbar span { display: block; height: 100%; background: var(--accent); }

<div class="wrap">
  <header>
    <h1>東排灣語祖孫小遊戲</h1>
    <p class="sub" id="subline">聽 vuvu 說族語，猜猜是哪一張卡！</p>
  </header>

  <div class="previewbar" id="previewbar" hidden="">
    <span>這是家人打開分享連結看到的畫面</span>
    <button class="btn small" id="exit-preview">回到準備題目</button>
  </div>

  <nav role="tablist" aria-label="功能" id="nav" hidden="">
    <button class="tab" role="tab" id="tab-guess" aria-controls="p-guess" aria-selected="false">聽音猜猜看</button>
    <button class="tab" role="tab" id="tab-sent" aria-controls="p-sent" aria-selected="false">兩張卡造一句</button>
    <button class="tab" role="tab" id="tab-prep" aria-controls="p-prep" aria-selected="false">準備題目</button>
  </nav>

  <section class="panel" id="p-guess" role="tabpanel" aria-labelledby="tab-guess">
    <div id="guess-area"></div>
  </section>

  <section class="panel" id="p-sent" role="tabpanel" aria-labelledby="tab-sent" hidden="">
    <div id="sent-area"></div>
  </section>

  <section class="panel" id="p-prep" role="tabpanel" aria-labelledby="tab-prep" hidden="">
    <div class="sharebar" id="sharebar">
      <span class="msg" id="share-msg"></span>
      <span class="todo" id="share-detail"></span>
      <div class="row">
        <button class="btn small" id="publish-btn">更新分享版</button>
        <button class="btn small ghost" id="preview-btn">預覽家人看到的畫面</button>
      </div>
    </div>

    <div class="status">
      <h2>準備題目</h2>
      <span class="score" id="prep-progress"></span>
    </div>
    <div class="progressbar" aria-hidden="true"><span id="prep-bar" style="width:0%"></span></div>
    <div class="notice">
      <strong>怎麼做：</strong>每張卡放進一個 vuvu 的錄音檔，有空再拍下孫子畫的字卡、填上拼音。整理好後按上面的「<strong>更新分享版</strong>」，錄音和照片就會存到雲端，家人用分享連結打開只會看到「聽音猜猜看」。
    </div>

    <h3>字卡</h3>
    <div class="chips" id="cat-chips" role="group" aria-label="依類別篩選"></div>
    <div class="list" id="card-list"></div>

    <div class="formgrid" style="border-top:1px solid var(--line); padding-top:14px">
      <label class="fieldlabel">新增字卡（中文）<input type="text" id="new-zh" placeholder="例如：鍋子"></label>
      <label class="fieldlabel">類別<select id="new-cat"></select></label>
      <div class="full"><button class="btn small" id="add-card">新增這張字卡</button></div>
    </div>

    <h3 style="margin-top:8px">造句題目（只有你看得到）</h3>
    <div class="notice">選兩張卡，請 vuvu 自然地說成一句話，把錄音放進來，再填上 vuvu 確認過的族語句子。卡片上的詞會在答案裡自動標出來。</div>
    <div class="formgrid">
      <label class="fieldlabel">第一張卡<select id="s-a"></select></label>
      <label class="fieldlabel">第二張卡<select id="s-b"></select></label>
      <label class="fieldlabel full">族語句子（vuvu 確認過的拼音）<input type="text" id="s-pw" placeholder="照 vuvu 的說法填寫"></label>
      <label class="fieldlabel full">中文意思<input type="text" id="s-zh" placeholder="例如：vuvu 在吃香蕉"></label>
      <div class="full row">
        <label class="file">選擇句子錄音檔<input type="file" id="s-audio" accept="audio/*"></label>
        <span class="todo" id="s-audio-name">尚未選擇</span>
      </div>
      <div class="full"><button class="btn small" id="add-sent">加入造句題目</button></div>
    </div>
    <div class="list" id="sent-list"></div>

    <h3 style="margin-top:8px">備份</h3>
    <div class="notice">「<strong>下載家人版網頁</strong>」會產生一個 index.html，裡面只有「聽音猜猜看」，錄音和照片都包在檔案裡，可以放到 GitHub Pages 等免費網站，家人不用登入就能玩。題目改了要重新下載、再上傳一次。</div>
    <div class="notice">可以另外存一份題庫檔當備份。舊的題庫檔也能在這裡匯入，匯入後按「更新分享版」就會放上雲端。</div>
    <div class="row">
      <button class="btn small" id="export-btn">匯出題庫檔</button>
      <button class="btn small" id="standalone-btn">下載家人版網頁</button>
      <label class="file">匯入題庫檔<input type="file" id="import-file" accept=".json,application/json"></label>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

    });
    state.sentences.forEach(function (s) {
      if (s.audio && !s.audioId) jobs.push({ label: "造句錄音", run: function () { return uploadAudio(s.audio).then(function (id) { s.audioId = id; }); } });
    });
    var failed = [], i = 0;
    function step() {
      if (i >= jobs.length) return Promise.resolve();
      var j = jobs[i++]; btn.textContent = "上傳中 " + i + " / " + jobs.length;
      return j.run().catch(function (err) { failed.push(j.label + (err && err.code === "too_large" ? "（檔案太大）" : "")); }).then(step);
    }
    step().then(function () {
      btn.textContent = "更新中…";
      if (failed.length) toast("有 " + failed.length + " 個檔案沒上傳成功：" + failed.slice(0, 2).join("、") + "，其他會先更新");
      var pub = stripForPub();
      meta.dirty = failed.length > 0; meta.basePub = pub.savedAt;
      return writeDraft().then(function () { return artifactApi.publish(buildDoc(pub)); });
    }).then(function () {
      toast("分享版已更新");
    }).catch(function (err) {
      meta.dirty = true; writeDraft();
      var code = err && err.code;
      if (code === "conflict") toast("網頁剛被更新過，正在重新載入，你的修改還留在這台裝置上");
      else if (code === "not_writer" || code === "not_granted") toast("你沒有這個網頁的編輯權限");
      else if (code === "too_large") toast("內容太大，無法更新");
      else if (code === "rate_limited") toast("更新太頻繁了，請過一分鐘再試");
      else toast("更新沒有成功，請稍後再試");
    }).then(function () {
      publishing = false; btn.disabled = false; btn.textContent = "更新分享版"; renderShareBar(); if (current === "prep") renderPrep();
    });
  };

  /* ---------- 準備題目 ---------- */
  var filter = "全部";
  function renderPrep() {
    renderShareBar();
    var total = state.cards.length, done = playable().length;
    $("prep-progress").textContent = "已放錄音 " + done + " / " + total + " 張・造句 " + sentPool().length + " 組";
    $("prep-bar").style.width = (total ? Math.round(done / total * 100) : 0) + "%";

    var chips = $("cat-chips");
    var cats = ["全部"].concat(CATS.map(function (c) { return c.key; }));
    chips.innerHTML = cats.map(function (c) { return '<button class="chip" aria-pressed="' + (c === filter) + '" data-c="' + esc(c) + '">' + esc(c) + '</button>'; }).join("");
    Array.prototype.forEach.call(chips.querySelectorAll(".chip"), function (b) { b.onclick = function () { filter = b.getAttribute("data-c"); renderPrep(); }; });

    var list = $("card-list");
    var cards = state.cards.filter(function (c) { return filter === "全部" || c.cat === filter; });
    list.innerHTML = cards.map(function (c) {
      var src = imgSrc(c), au = hasAudio(c);
      return '<div class="item" data-id="' + esc(c.id) + '">' +
        '<div class="thumb" style="background:' + catColor(c.cat) + '">' + (src ? '<img src="' + esc(src) + '" alt="">' : esc(c.cat)) + '</div>' +
        '<div class="fields"><div class="line1"><span class="zhname">' + esc(c.zh) + '</span>' +
        (au ? '<span class="ok">有錄音</span>' : '<span class="todo">還沒錄音</span>') + '</div>' +
        '<input type="text" class="pw-in" aria-label="' + esc(c.zh) + ' 的族語拼音" placeholder="族語拼音（vuvu 確認過再填）" value="' + esc(c.pw) + '">' +
        '<div class="row">' +
        '<label class="file">' + (au ? "換錄音檔" : "放進錄音檔") + '<input type="file" class="au-in" accept="audio/*"></label>' +
        (au ? '<button class="btn small ghost play-btn">播放</button>' : '') +
        '<label class="file">' + (src ? "換字卡照片" : "放進字卡照片") + '<input type="file" class="im-in" accept="image/*"></label>' +
        '<button class="btn small ghost del-btn">刪除</button>' +
        '</div></div></div>';
    }).join("");
    Array.prototype.forEach.call(list.querySelectorAll(".item"), function (row) {
      var c = cardById(row.getAttribute("data-id"));
      row.querySelector(".pw-in").addEventListener("input", function (e) { c.pw = e.target.value; save(); });
      row.querySelector(".au-in").addEventListener("change", function (e) { var f = e.target.files[0]; if (!f) return; c.audio = f.slice(0, f.size, f.type || "audio/mp4"); c.audioId = null; save(); renderPrep(); play(c); toast("已放進「" + c.zh + "」的錄音"); });
      row.querySelector(".im-in").addEventListener("change", function (e) { var f = e.target.files[0]; if (!f) return; shrinkImage(f).then(function (b) { c.img = b; c.imgId = null; save(); renderPrep(); toast("已放進「" + c.zh + "」的字卡照片"); }); });
      var pb = row.querySelector(".play-btn"); if (pb) pb.onclick = function () { play(c); };
      row.querySelector(".del-btn").onclick = function () { confirmDelete(row, function () { state.cards = state.cards.filter(function (x) { return x.id !== c.id; }); state.sentences = state.sentences.filter(function (s) { return s.a !== c.id && s.b !== c.id; }); save(); renderPrep(); }); };
    });

    var opts = state.cards.map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.cat + "｜" + c.zh) + '</option>'; }).join("");
    var sa = $("s-a"), sb = $("s-b"), va = sa.value, vb = sb.value;
    sa.innerHTML = opts; sb.innerHTML = opts;
    if (va && cardById(va)) sa.value = va;
    if (vb && cardById(vb)) sb.value = vb; else if (state.cards.length > 1) sb.selectedIndex = 1;

    var sl = $("sent-list");
    sl.innerHTML = state.sentences.map(function (s) {
      var a = cardById(s.a), b = cardById(s.b);
      return '<div class="item" data-id="' + esc(s.id) + '" style="grid-template-columns:minmax(0,1fr)"><div class="fields">' +
        '<div class="line1"><span class="zhname">' + esc((a ? a.zh : "?") + " ＋ " + (b ? b.zh : "?")) + '</span>' + (hasAudio(s) ? '<span class="ok">有錄音</span>' : '<span class="todo">還沒錄音</span>') + '</div>' +
        '<span>' + (s.pw ? esc(s.pw) : '<span class="todo">（族語句子還沒填）</span>') + '　<span class="todo">' + esc(s.zh || "") + '</span></span>' +
        '<div class="row">' + (hasAudio(s) ? '<button class="btn small ghost play-btn">播放</button>' : '') + '<button class="btn small ghost del-btn">刪除</button></div></div></div>';
    }).join("");
    Array.prototype.forEach.call(sl.querySelectorAll(".item"), function (row) {
      var id = row.getAttribute("data-id"), s = state.sentences.filter(function (x) { return x.id === id; })[0];
      var pb = row.querySelector(".play-btn"); if (pb) pb.onclick = function () { play(s); };
      row.querySelector(".del-btn").onclick = function () { confirmDelete(row, function () { state.sentences = state.sentences.filter(function (x) { return x.id !== id; }); save(); renderPrep(); }); };
    });
  }
  function confirmDelete(row, doit) {
    var box = row.querySelector(".fields .row");
    if (box.querySelector(".sure")) return;
    box.insertAdjacentHTML("beforeend", '<span class="sure row"><span class="todo">確定刪除？</span><button class="btn small yes">刪除</button><button class="btn small ghost no">取消</button></span>');
    box.querySelector(".yes").onclick = doit;
    box.querySelector(".no").onclick = function () { box.querySelector(".sure").remove(); };
  }

  var newCat = $("new-cat");
  newCat.innerHTML = CATS.map(function (c) { return '<option>' + c.key + '</option>'; }).join("");
  $("add-card").onclick = function () {
    var zh = $("new-zh").value.trim();
    if (!zh) { toast("請先輸入中文"); return; }
    state.cards.push({ id: uid(), zh: zh, cat: newCat.value, pw: "" });
    $("new-zh").value = ""; filter = newCat.value; save(); renderPrep(); toast("已新增「" + zh + "」");
  };

  var pendingSentAudio = null;
  $("s-audio").addEventListener("change", function (e) {
    var f = e.target.files[0]; pendingSentAudio = f ? f.slice(0, f.size, f.type || "audio/mp4") : null;
    $("s-audio-name").textContent = f ? f.name : "尚未選擇";
    if (pendingSentAudio) play({ audio: pendingSentAudio });
  });
  $("add-sent").onclick = function () {
    var a = $("s-a").value, b = $("s-b").value;
    if (a === b) { toast("請選兩張不同的卡"); return; }
    if (!pendingSentAudio) { toast("請先選擇 vuvu 說這句話的錄音檔"); return; }
    state.sentences.push({ id: uid(), a: a, b: b, pw: $("s-pw").value.trim(), zh: $("s-zh").value.trim(), audio: pendingSentAudio, audioId: null });
    pendingSentAudio = null; $("s-audio").value = ""; $("s-audio-name").textContent = "尚未選擇";
    $("s-pw").value = ""; $("s-zh").value = "";
    save(); renderPrep(); toast("已加入造句題目");
  };

  /* ---------- 匯出／匯入 ---------- */
  function fromDataURL(d) {
    if (!d || typeof d !== "string" || d.indexOf("data:") !== 0) return null;
    try {
      var parts = d.split(","), mime = (parts[0].match(/data:([^;]+)/) || [])[1] || "application/octet-stream";
      var bin = atob(parts[1]), arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type: mime });
    } catch (e) { return null; }
  }
  function audioData(o) { if (o.audio) return toDataURL(o.audio); if (o.audioId) return audioSrc(o).then(function (s) { return s || null; }); return Promise.resolve(null); }
  function imgData(c) {
    if (c.img) return toDataURL(c.img);
    if (c.imgId) return fetch("/_blob/" + c.imgId).then(function (r) { return r.ok ? r.blob() : null; }).then(toDataURL).catch(function () { return null; });
    return Promise.resolve(null);
  }
  $("export-btn").onclick = function () {
    var btn = this; btn.disabled = true; btn.textContent = "整理中…";
    Promise.all(state.cards.map(function (c) { return Promise.all([audioData(c), imgData(c)]).then(function (r) { return { id: c.id, zh: c.zh, cat: c.cat, pw: c.pw, audio: r[0], img: r[1] }; }); }))
      .then(function (cards) {
        return Promise.all(state.sentences.map(function (s) { return audioData(s).then(function (au) { return { id: s.id, a: s.a, b: s.b, pw: s.pw, zh: s.zh, audio: au }; }); }))
          .then(function (sents) { return JSON.stringify({ app: "eastpaiwan-game", v: 1, exported: new Date().toISOString(), cards: cards, sentences: sents }); });
      })
      .then(function (json) {
        var w = window.claude;
        var p = (w && w.use) ? w.use("downloads") : Promise.resolve(null);
        return p.then(function (dl) {
          if (!dl) { toast("這個畫面不能下載檔案，請在 claude.ai 開啟這個網頁再匯出"); return; }
          var d = new Date(), name = "東排灣語題庫_" + d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") + ".json";
          return dl.save({ filename: name, data: new Blob([json], { type: "application/json" }) }).then(function () { toast("已匯出題庫檔"); }, function (err) { if (!err || err.code !== "declined") toast("匯出沒有成功，請稍後再試"); });
        });
      })
      .catch(function () { toast("匯出沒有成功，請稍後再試"); })
      .then(function () { btn.disabled = false; btn.textContent = "匯出題庫檔"; });
  };
  $("import-file").addEventListener("change", function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var data = JSON.parse(r.result);
        if (!data || data.app !== "eastpaiwan-game" || !Array.isArray(data.cards)) throw new Error("bad");
        state = {
          cards: data.cards.map(function (c) { return { id: String(c.id), zh: String(c.zh || ""), cat: String(c.cat || "其他"), pw: String(c.pw || ""), audio: fromDataURL(c.audio), img: fromDataURL(c.img), audioId: null, imgId: null }; }),
          sentences: (data.sentences || []).map(function (s) { return { id: String(s.id), a: String(s.a), b: String(s.b), pw: String(s.pw || ""), zh: String(s.zh || ""), audio: fromDataURL(s.audio), audioId: null }; })
        };
        save(); filter = "全部"; renderPrep(); toast("已匯入：" + state.cards.length + " 張卡、" + state.sentences.length + " 組造句。記得按「更新分享版」");
      } catch (err) { toast("這個檔案不是題庫檔，請選擇從這個網頁匯出的 .json 檔"); }
      e.target.value = "";
    };
    r.readAsText(f);
  });

  /* ---------- 啟動：先顯示家人畫面，確認是編輯者再打開準備區 ---------- */
  $("standalone-btn").onclick = function () {
    var btn = this; btn.disabled = true; btn.textContent = "整理中…";
    var cards = state.cards.filter(hasAudio);
    Promise.all(cards.map(function (c) { return Promise.all([audioData(c), imgData(c)]).then(function (r) { return { id: c.id, zh: c.zh, cat: c.cat, pw: c.pw || "", audioData: r[0], imgData: r[1] }; }); }))
      .then(function (list) {
        list = list.filter(function (c) { return c.audioData; });
        if (list.length < 4) { toast("至少要 4 張卡有錄音才能做家人版"); return; }
        var others = state.cards.filter(function (c) { return !hasAudio(c); }).map(function (c) { return { id: c.id, zh: c.zh, cat: c.cat, pw: c.pw || "" }; });
        var html = buildDoc({ v: 2, standalone: true, savedAt: new Date().toISOString(), cards: list.concat(others), sentences: [] });
        var w = window.claude;
        var p = (w && w.use) ? w.use("downloads") : Promise.resolve(null);
        return p.then(function (dl) {
          if (!dl) { toast("這個畫面不能下載檔案，請在 claude.ai 開啟這個網頁再下載"); return; }
          return dl.save({ filename: "index.html", data: new Blob([html], { type: "text/html" }) }).then(function () { toast("已下載 index.html（" + (html.length / 1048576).toFixed(1) + " MB）"); }, function (err) { if (!err || err.code !== "declined") toast("下載沒有成功，請稍後再試"); });
        });
      })
      .catch(function () { toast("下載沒有成功，請稍後再試"); })
      .then(function () { btn.disabled = false; btn.textContent = "下載家人版網頁"; });
  };

  applyMode(); show("guess");
  var w = window.claude;
  if (PUB && PUB.standalone) w = null;
  if (w && w.use) {
    w.use("user").then(function (u) { return u ? u.canEdit() : false; }).catch(function () { return false; }).then(function (ok) {
      canEditPage = !!ok;
      if (!canEditPage) return;
      return Promise.all([w.use("assets").catch(function () { return null; }), w.use("artifact").catch(function () { return null; }), loadDraft()]).then(function (r) {
        assetsApi = r[0]; artifactApi = r[1];
        var d = r[2], restored = false;
        if (d && Array.isArray(d.cards)) {
          var oldFormat = d.v !== 2;
          var hasContent = d.cards.some(function (c) { return c.audio || c.img || c.pw; }) || (d.sentences || []).length > 0;
          if ((oldFormat && hasContent) || (!oldFormat && d.dirty)) {
            state = { cards: d.cards, sentences: Array.isArray(d.sentences) ? d.sentences : [] };
            meta.dirty = true; meta.basePub = d.basePub || null; restored = true;
          }
        }
        if (!restored && !PUB) state = seed();
        mode = "editor"; applyMode(); show("prep");
        if (restored && (!PUB || d.v !== 2)) toast("找到這台裝置上之前放的內容，按「更新分享版」存到雲端");
      });
    });
  }
})();
</script></body></html>
